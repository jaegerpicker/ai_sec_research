name: ai-redteam-lab-v0

services:
  vulnerable-rag:
    build:
      context: ..
      dockerfile: lab/vulnerable-agents/injection-via-rag/Dockerfile
    networks:
      - redteam-lab
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    security_opt:
      - no-new-privileges:true

  egress-proxy:
    image: alpine:3.20
    command: ["sh", "-c", "echo 'egress-proxy placeholder'; sleep infinity"]
    networks:
      - redteam-lab
    read_only: true
    security_opt:
      - no-new-privileges:true

networks:
  redteam-lab:
    driver: bridge
